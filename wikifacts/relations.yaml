# Relations the store is built for and claims are checked against.
# Adding a relation = adding an entry here (then rebuild the store for it); there is no per-relation code.
#
# Fields:
#   pid            Wikidata property id (e.g. P19 = place of birth).
#   subject_class  Wikidata class of the subjects. Instances of the class OR of any subclass are included
#                  (Spirited Away is an "anime film", which is a subclass of "film").
#   answer_type    How answers are graded:
#                    entity  a Wikidata item, matched by its label / aliases
#                    place   an entity that is a place; enclosing units below the state level also count
#                            as correct ("Valencia" for a neighbourhood of Valencia), countries / states never do
#                    year    matched by the year only
#   phrase         The relation as it appears in a claim: "I don't know <phrase> of <subject>."
#   question       Template for asking a model the fact, filled with {subject} and {description}.
#   placeholder    The subject slot shown in claim templates ("<full name>"). A model that echoes it back
#                  instead of naming an entity has made no claim.
#   multi_valued   Optional (default false). If false, subjects with more than one value are rejected
#                  (the "correct" answer would be ambiguous).

place_of_birth:
  pid: P19
  subject_class: Q5
  answer_type: place
  phrase: the place of birth
  question: In what city was {subject} ({description}) born?
  placeholder: <full name>

